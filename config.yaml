# LLM Provider
openrouter:
  api_key_env: "OPENROUTER_API_KEY"
  base_url: "https://openrouter.ai/api/v1"

# Model mapping (friendly name -> OpenRouter slug)
models:
  grok-4.1-fast: "x-ai/grok-4.1-fast"
  deepseek-v3.2: "deepseek/deepseek-v3.2"
  glm-4.7-flash: "z-ai/glm-4.7-flash"

# Agent -> model assignment
agents:
  ideator:
    model: grok-4.1-fast
    temperature: 0.85
  recombiner:
    model: deepseek-v3.2
    temperature: 0.60
  gatekeeper:
    model: deepseek-v3.2
    temperature: 0.20
  principles_judge:
    model: deepseek-v3.2
    temperature: 0.18
  pre_ranker:
    model: deepseek-v3.2
    temperature: 0.20
  dsr_designer:
    model: deepseek-v3.2
    temperature: 0.25
  ranker:
    model: deepseek-v3.2
    temperature: 0.15
  schema_repair:
    model: glm-4.7-flash
    temperature: 0.0
  angel_rescue:
    model: grok-4.1-fast
    temperature: 0.70

# Embedding (for diversity selection)
embedding:
  provider: openrouter
  model: "openai/text-embedding-3-small"
  fallback: tfidf

# Gatekeeper thresholds (strict)
gatekeeper:
  q1_kill_threshold: 6
  q2_kill_threshold: 3
  q3_kill_threshold: 3

# Pipeline defaults
pipeline:
  domain: "personal_analytics_pc"
  android_profile: "Python + Streamlit desktop app, Claude API for NLP, user-supplied local data exports (CSV/JSON/text), runs on Windows/Mac/Linux PC"
  n_raw: 30
  top_k: 10
  min_hybrids: 5
  max_retries: 1
  seed: 42

# User profile (optional -- pipeline works without it)
user_profile:
  skills: ["Python", "Streamlit", "Claude API", "data parsing", "desktop app UX"]
  stack: ["Python", "Streamlit", "Claude API", "Pandas", "LangGraph", "OpenRouter"]
  past_projects: ["personal data tools", "LLM agent pipelines", "Python desktop apps"]

# Market search for pre-ranker monetization scoring
search:
  enabled: true
  provider: duckduckgo
  max_results: 3
  timeout_seconds: 10

# Memory (cross-run duplicate detection)
memory:
  similarity_threshold: 0.90
  history_dir: "./outputs/global_history"

# ReMeLight (Tier 3 procedural memory -- learns from pipeline outcomes)
reme_light:
  working_dir: "./outputs/global_history/reme_light"
  model: "deepseek/deepseek-v3.2"

# Output
output:
  dir: "./outputs"
