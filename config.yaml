# LLM Provider
openrouter:
  api_key_env: "OPENROUTER_API_KEY"
  base_url: "https://openrouter.ai/api/v1"

# Model mapping (friendly name -> OpenRouter slug)
models:
  grok-4.1-fast: "x-ai/grok-4.1-fast"
  deepseek-v3.2: "deepseek/deepseek-v3.2"
  glm-4.7-flash: "z-ai/glm-4.7-flash"

# Agent -> model assignment
agents:
  ideator:
    model: grok-4.1-fast
    temperature: 0.85
  recombiner:
    model: deepseek-v3.2
    temperature: 0.60
  gatekeeper:
    model: deepseek-v3.2
    temperature: 0.20
  principles_judge:
    model: deepseek-v3.2
    temperature: 0.18
  pre_ranker:
    model: deepseek-v3.2
    temperature: 0.20
  dsr_designer:
    model: deepseek-v3.2
    temperature: 0.25
  ranker:
    model: deepseek-v3.2
    temperature: 0.15
  schema_repair:
    model: glm-4.7-flash
    temperature: 0.0
  angel_rescue:
    model: grok-4.1-fast
    temperature: 0.70

# Embedding (for diversity selection)
embedding:
  provider: openrouter
  model: "openai/text-embedding-3-small"
  fallback: tfidf

# Gatekeeper thresholds (strict)
gatekeeper:
  q1_kill_threshold: 6
  q2_kill_threshold: 3
  q3_kill_threshold: 3

# Pipeline defaults
pipeline:
  domain: "biology_olympiad"
  android_profile: ""
  n_raw: 30
  top_k: 10
  min_hybrids: 5
  max_retries: 1
  seed: 42

# User profile (optional -- pipeline works without it)
user_profile:
  skills: ["React", "Next.js", "FastAPI", "Python", "Claude API", "full-stack web dev"]
  stack: ["Next.js", "FastAPI", "Claude API", "PostgreSQL", "LangGraph", "OpenRouter"]
  past_projects: ["ed-tech web apps", "LLM agent pipelines", "study tool prototypes"]

# Academic paper search for evidence-grounded idea generation
search:
  enabled: true
  provider: semantic_scholar
  max_results_per_query: 5
  n_queries: 4
  timeout_seconds: 15

# Memory (cross-run duplicate detection)
memory:
  similarity_threshold: 0.90
  history_dir: "./outputs/global_history"

# ReMeLight (Tier 3 procedural memory -- learns from pipeline outcomes)
reme_light:
  working_dir: "./outputs/global_history/reme_light"
  model: "deepseek/deepseek-v3.2"

# Output
output:
  dir: "./outputs"
